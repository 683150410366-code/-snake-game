<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #1e1e2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        #game-container { text-align: center; }
        .score-board {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        canvas {
            border: 4px solid #89b4fa;
            border-radius: 8px;
            background-color: #11111b;
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
        }

        .controls {
            margin-top: 15px;
            font-size: 14px;
            color: #a6adc8;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="score-board">คะแนน: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            กดปุ่มลูกศร (↑ ↓ ← →) บนคีย์บอร์ดเพื่อเริ่มเล่นและบังคับทิศทาง
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0, dy = 0;
        let score = 0;
        let gameInterval = null;
        let gameStarted = false;

        document.addEventListener("keydown", changeDirection);

        function gameLoop() {
            if (hasGameEnded()) {
                alert(`Game Over! คะแนนของคุณคือ: ${score}`);
                resetGame();
                return;
            }
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#11111b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#a6e3a1" : "#a6e3a1b3";
                ctx.fillRect(
                    part.x * gridSize, part.y * gridSize,
                    gridSize - 2, gridSize - 2
                );
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            if (snake.some(part => part.x === food.x && part.y === food.y)) {
                generateFood();
            }
        }

        function drawFood() {
            ctx.fillStyle = "#f38ba8";
            ctx.fillRect(
                food.x * gridSize, food.y * gridSize,
                gridSize - 2, gridSize - 2
            );
        }

        function changeDirection(event) {
            const key = event.key;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (!gameStarted &&
                ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(key)) {
                gameStarted = true;
                gameInterval = setInterval(gameLoop, 100);
            }

            if (key === "ArrowLeft" && !goingRight)  { dx = -1; dy = 0; }
            if (key === "ArrowUp" && !goingDown)     { dx = 0; dy = -1; }
            if (key === "ArrowRight" && !goingLeft)  { dx = 1; dy = 0; }
            if (key === "ArrowDown" && !goingUp)     { dx = 0; dy = 1; }
        }

        function hasGameEnded() {
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x &&
                    snake[i].y === snake[0].y) return true;
            }

            return snake[0].x < 0 ||
                   snake[0].x >= tileCount ||
                   snake[0].y < 0 ||
                   snake[0].y >= tileCount;
        }

        function resetGame() {
            clearInterval(gameInterval);
            snake = [{ x: 10, y: 10 }];
            food = { x: 15, y: 15 };
            dx = 0; dy = 0; score = 0;
            scoreElement.innerText = score;
            gameStarted = false;
            clearCanvas();
            drawSnake();
            drawFood();
        }

        drawSnake();
        drawFood();
    </script>
</body>
</html>
